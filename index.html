<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f5f7"><meta name="description" content="本機圖片與影片壓縮轉檔工具"><title>圖片・影片壓縮轉檔</title><link rel="stylesheet" href="style.css"><style>#videoSettings[hidden]{display:none}</style></head><body>
<main class="shell"><header><div class="eyebrow"><span></span> LOCAL MEDIA TOOL</div><h1>圖片與影片，<br><em>一次整理好。</em></h1><p class="lead">壓縮、轉檔、批次處理。所有檔案只留在你的裝置，不會上傳。</p></header>
<section id="dropZone" class="drop-zone" tabindex="0" role="button" aria-label="選擇或拖入圖片與影片"><input id="fileInput" type="file" accept="image/*,video/*,.heic,.heif,.tif,.tiff,.svg,.bmp,.ico,.mkv,.avi,.mts,.m2ts" multiple hidden><div class="drop-icon">↓</div><div><strong>拖曳圖片或影片到這裡</strong><small>也可以一次選擇多個檔案</small></div><button id="chooseButton" type="button">選擇檔案</button></section>
<nav class="type-tabs" aria-label="設定種類"><button class="active" data-tab="image">圖片設定</button><button data-tab="video">影片設定</button></nav>
<section id="imageSettings" class="settings settings-grid"><label>輸出格式<select id="imageFormat"><option value="image/jpeg">JPG</option><option value="image/webp" selected>WebP</option><option value="image/avif">AVIF</option><option value="image/png">PNG（無損）</option></select></label><label class="quality-field"><span>品質</span><div class="quality-row"><input id="quality" type="range" min="1" max="100" value="80"><input id="qualityNumber" type="number" min="1" max="100" value="80" aria-label="品質數字"><span>%</span></div></label><label>最大寬度（px）<input id="maxWidth" type="number" min="1" placeholder="不限"></label><label>最大高度（px）<input id="maxHeight" type="number" min="1" placeholder="不限"></label><label class="limit-field">容量上限<div class="compound"><input id="imageLimit" type="number" min="1" placeholder="不限"><select id="imageUnit" aria-label="圖片容量單位"><option>KB</option><option>MB</option></select></div></label><label class="check"><input id="keepSmaller" type="checkbox" checked><span>結果變大時保留原檔</span></label></section>
<section id="videoSettings" class="settings" hidden><div><label for="targetSize">每支影片目標容量</label><p>瀏覽器壓縮容量可能略有差異</p></div><div class="size-control"><input id="targetSize" type="number" value="100" min="1" step="0.1"><select id="sizeUnit"><option>MB</option><option>GB</option></select></div></section>
<section id="queuePanel" class="queue-panel" hidden><div class="queue-head"><div><span id="fileCount">0</span> 個檔案</div><button id="clearButton" class="text-button">清除全部</button></div><div id="fileList" class="file-list"></div></section>
<div id="notice" class="notice" role="status">圖片支援 JPG、PNG、WebP、HEIC、TIFF 等；影片支援瀏覽器可播放的 MP4、MOV、M4V、WebM 等。</div>
<div class="actions"><span id="summary">尚未加入檔案</span><button id="shareAllButton" class="secondary" hidden>儲存／分享全部</button><button id="zipButton" class="secondary" hidden>圖片 ZIP</button><button id="startButton" class="primary" disabled>開始批次處理 <b>→</b></button><button id="cancelButton" class="danger" hidden>取消</button></div></main>
<video id="processor" playsinline hidden></video><canvas id="canvas" hidden></canvas><script src="app.js"></script></body></html>
