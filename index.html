<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>本機圖片壓縮工具 v8</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body { font-family: -apple-system, BlinkMacSystemFont, system-ui; background:#f2f2f2; padding:16px; }
.container { max-width:720px; margin:auto; background:#fff; border-radius:12px; padding:16px; box-shadow:0 4px 12px rgba(0,0,0,.1); }
.dropzone { border:2px dashed #aaa; border-radius:10px; padding:32px; text-align:center; cursor:pointer; color:#555; }
.dropzone.drag { background:#eef6ff; border-color:#3b82f6; }
.controls { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
.controls label { flex-basis:100%; }
.controls input, .controls select, .controls button { flex:1 1 100%; padding:8px; margin-top:4px; box-sizing:border-box; }
button { background:#3b82f6; color:#fff; border:none; border-radius:8px; font-size:16px; cursor:pointer; }
.preview { display:grid; grid-template-columns:repeat(auto-fill, minmax(120px,1fr)); gap:10px; margin-top:16px; }
.preview-item { text-align:center; font-size:12px; border:1px solid #ddd; padding:4px; border-radius:6px; background:#fafafa; position:relative; }
.preview-item img { width:100%; height:80px; object-fit:cover; border-radius:4px; }
.remove-btn { position:absolute; top:2px; right:2px; background:#ff4d4f; color:#fff; border:none; border-radius:4px; font-size:10px; cursor:pointer; padding:1px 4px; }
.info { font-size:11px; margin-top:2px; white-space:pre-line; }
small { color:#666; }
.size-container { display:flex; gap:8px; }
.size-container input, .size-container select { flex:1 1 auto; }
#actionBtn { margin-top:16px; width:100%; display:none; }
</style>
</head>
<body>

<div class="container">
<h2>本機圖片壓縮 v8</h2>

<div class="dropzone" id="dropzone">
  拖曳圖片到這裡<br>
  <small>或點擊選擇（iPhone 請點擊）</small>
</div>

<input type="file" id="fileInput" multiple accept="image/*,.heic,.heif" hidden>

<div class="controls">
<label>輸出格式</label>
<select id="format">
  <option value="image/jpeg">JPG</option>
  <option value="image/webp">WEBP</option>
  <option value="image/png">PNG</option>
</select>

<label>品質（預設 100）</label>
<input type="number" id="quality" value="100" min="1" max="100">

<label>目標檔案大小</label>
<div class="size-container">
  <input type="number" id="sizeValue" placeholder="可留空">
  <select id="sizeUnit">
    <option value="mb" selected>MB</option>
    <option value="kb">KB</option>
  </select>
</div>

<button id="startBtn">開始處理</button>
</div>

<div class="preview" id="preview"></div>

<button id="actionBtn"></button>

<small>
• 所有處理皆在本機完成<br>
• iPhone 完成後可直接分享或儲存到相簿
</small>
</div>

<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script>
let files = [];
let outputFiles = [];
let zipBlobGlobal;

const dz = document.getElementById("dropzone");
const fi = document.getElementById("fileInput");
const preview = document.getElementById("preview");
const actionBtn = document.getElementById("actionBtn");
const startBtn = document.getElementById("startBtn");

// 判斷是否 iOS
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;

// 拖曳與點擊事件
dz.addEventListener("click", () => fi.click());
dz.addEventListener("dragover", e => { e.preventDefault(); dz.classList.add("drag"); });
dz.addEventListener("dragleave", e => { e.preventDefault(); dz.classList.remove("drag"); });
dz.addEventListener("drop", e => { e.preventDefault(); dz.classList.remove("drag"); handleFiles([...e.dataTransfer.files]); });

fi.addEventListener("change", e => handleFiles([...fi.files]));

// 處理上傳檔案
function handleFiles(f) {
  files = f;
  dz.innerText = `${files.length} 張圖片已加入`;
  renderPreview();
}

// 顯示預覽
function renderPreview() {
  preview.innerHTML = "";
  files.forEach((file, index) => {
    const div = document.createElement("div");
    div.className = "preview-item";

    const img = document.createElement("img");
    img.src = URL.createObjectURL(file);

    const remove = document.createElement("button");
    remove.className = "remove-btn";
    remove.textContent = "移除";
    remove.addEventListener("click", () => { files.splice(index,1); renderPreview(); });

    const info = document.createElement("div");
    info.className = "info";
    info.textContent = `原始: ${(file.size/1024/1024).toFixed(2)} MB`;

    div.appendChild(img);
    div.appendChild(remove);
    div.appendChild(info);
    preview.appendChild(div);
  });
}

// 開始壓縮
startBtn.addEventListener("click", start);

async function start() {
  if (!files.length) return alert("請先加入圖片");

  const format = document.getElementById("format").value;
  let qInit = document.getElementById("quality").value / 100;
  const sizeVal = document.getElementById("sizeValue").value;
  const unit = document.getElementById("sizeUnit").value;
  const maxSize = sizeVal ? sizeVal * (unit==="mb"?1024*1024:1024) : null;

  outputFiles = [];

  for (let i=0; i<files.length; i++) {
    const file = files[i];
    const img = await loadImg(file);
    let q = qInit;
    let blob;

    do {
      blob = await compress(img, format, q);
      q -= 0.05;
    } while (maxSize && blob.size > maxSize && q > 0.1);

    const outFile = new File([blob], file.name.replace(/\..+$/, "") + "." + format.split("/")[1], { type: format });
    outputFiles.push(outFile);

    const div = preview.querySelectorAll(".preview-item")[i];
    const info = div.querySelector(".info");
    info.textContent = `原始: ${(file.size/1024/1024).toFixed(2)} MB\n壓縮: ${(blob.size/1024/1024).toFixed(2)} MB`;
  }

  // 顯示桌機或 iPhone 按鈕
  actionBtn.style.display = "block";

  if (isIOS && navigator.canShare && navigator.canShare({ files: outputFiles })) {
    actionBtn.textContent = "儲存到相簿 / 分享";
    actionBtn.onclick = saveToPhotos;
  } else {
    actionBtn.textContent = "下載壓縮檔案 (ZIP)";
    zipBlobGlobal = await createZip(outputFiles);
    actionBtn.onclick = () => download(zipBlobGlobal, "compressed_images.zip");
  }
}

function loadImg(file) {
  return new Promise(r => {
    const img = new Image();
    img.onload = () => r(img);
    img.src = URL.createObjectURL(file);
  });
}

function compress(img, type, q) {
  return new Promise(r=>{
    const c=document.createElement("canvas");
    c.width=img.width; c.height=img.height;
    c.getContext("2d").drawImage(img,0,0);
    c.toBlob(r,type,q);
  });
}

async function createZip(filesArr){
  const zip = new JSZip();
  filesArr.forEach(f=>zip.file(f.name,f));
  return await zip.generateAsync({ type:"blob" });
}

function download(blob,name){
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=name;
  a.click();
}

// iPhone / iPad 儲存到相簿
async function saveToPhotos(){
  if (navigator.canShare && navigator.canShare({ files: outputFiles })) {
    try {
      await navigator.share({ files: outputFiles, title:"壓縮後圖片" });
    } catch(e){
      alert("分享取消或失敗");
    }
  } else {
    alert("此裝置不支援直接儲存相簿，請長按下載圖片");
  }
}
</script>

</body>
</html>
